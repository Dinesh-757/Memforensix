version: "3.9"

# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Overrides development settings with production-safe values.

services:
  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  celery_worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=4
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 4G

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  frontend:
    restart: always
